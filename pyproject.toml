[project]
name = "mtg-goldfish-simulator"
# Fixed packaging version — NEVER bumped by CI, so pyproject.toml and uv.lock
# never drift (nothing to pull/re-lock after a push). The user-facing version
# (app badge + docs) is derived from the git commit count at runtime/deploy;
# see src/mtg_goldfish/__init__.py.
version = "0.1.0"
description = "Solitaire (goldfish) Magic: the Gathering simulator that exhaustively explores lines of play to check user-defined properties on a deck."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
mtg-goldfish = "mtg_goldfish.web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_goldfish"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
