name: Deploy docs

# On every push to main, publish docs/ to GitHub Pages. The displayed version
# (0.1.<commit-count>) is injected into the docs at deploy time only — NOTHING
# is committed back, so pyproject.toml / uv.lock never move and your local repo
# always matches the server (nothing to pull after a push).
#
# ONE-TIME SETUP: repo Settings -> Pages -> "Build and deployment" -> Source ->
# "GitHub Actions".
on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the commit count is correct

      - name: Stamp the version into the docs (artifact only, not committed)
        run: |
          set -euo pipefail
          ver="0.1.$(git rev-list --count HEAD)"
          echo "Docs version: v$ver"
          sed -i -E "s#(<span class=\"ver\">)v[0-9]+\.[0-9]+\.[0-9]+(</span>)#\1v${ver}\2#" docs/*.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
